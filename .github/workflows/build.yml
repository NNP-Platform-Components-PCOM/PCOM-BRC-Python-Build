name: build-and-publish

# Thin caller: the actual build/publish/sign/scan logic lives in the shared
# PCOM-CICD reusable pipeline. This repository supplies the image inputs and
# builds one image per supported Python minor version.
#
# Versions run one at a time, with 3.12 last, so `latest` ends up as 3.12. Pin
# a version tag (3.11, 3.12, 3.13) in pipelines. Each build is based on the
# matching PCOM-BRC-Python image, which must be published first.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly rebuild so the images pick up fresh base security updates.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # cosign keyless signing
  security-events: write # SARIF upload to the Security tab

jobs:
  pipeline:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.13", "3.12"]
    uses: NNP-Platform-Components-PCOM/PCOM-CICD/.github/workflows/container-pipeline.yml@main
    secrets: inherit
    with:
      image-name: pcom-brc-python-build
      image-version: ${{ matrix.python_version }}
      build-args: python_version=${{ matrix.python_version }}
      platforms: linux/amd64
